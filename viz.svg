<text x="159.6" y="459.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">BST, size 1</text>
<rect x="24.0" y="471.0" width="39.2" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="43.6" y="491.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">15</text>
<rect x="65.2" y="471.0" width="188.8" height="30.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="159.6" y="491.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">12 &lt; 15 &lt; 20 → BST size 3</text>
<rect x="24.0" y="503.0" width="39.2" height="30.0" rx="4" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="43.6" y="523.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">10</text>
<rect x="65.2" y="503.0" width="188.8" height="30.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="159.6" y="523.0" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#1e293b" text-anchor="middle">left max 20 &gt; 10 → not BST</text>
<line x1="24.0" y1="549.0" x2="736.0" y2="549.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="569.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="573.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="574.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer: 3. The trap is checking each node with a separate isBST call — O(n²). The</text>
<text x="56.0" y="593.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">tuple-report version is O(n): validity and size travel together.</text>
<text x="72.0" y="628.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">answer</text>
